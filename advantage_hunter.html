<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advantage Hunter — Fayetteville Girls Silver</title>
<style>
  :root {
    --purple: #5b2a86;
    --purple-dark: #3f1d61;
    --silver: #9aa0a6;
    --silver-light: #e8e9ec;
    --gold: #c9961f;
    --bad: #b5392f;
    --ink: #1f2430;
    --ink-dim: #5b606b;
    --bg: #f6f5f8;
    --surface: #ffffff;
    --good: #1b7a43;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  header {
    background: var(--purple);
    color: #fff;
    padding: 14px 16px 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header .team {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--silver-light);
    margin: 0 0 2px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 800;
  }
  .modebar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid #e2e0e6;
  }
  .modebar button {
    flex: 1;
    padding: 9px 6px;
    border-radius: 999px;

    font-size: 12.5px;
    cursor: pointer;
  }

    background: var(--purple);

  }
  main {
    flex: 1;
    padding: 14px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;

    color: var(--ink-dim);
    font-weight: 700;
  }
  .progress .timer {
    color: var(--purple);
    font-variant-numeric: tabular-nums;
  }
  .scenario-title {
    font-size: 16px;
    font-weight: 800;
    margin: 0;
  }
  .scenario-text {
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0;
    line-height: 1.45;
  }
  .court-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid #e2e0e6;
    padding: 10px;
  }
  .court-card svg { width: 100%; height: auto; display: block; }
  .prompt {
    font-size: 15px;
    font-weight: 700;
    margin: 2px 0 0;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .choices button {
    text-align: left;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid #d8d6de;
    background: var(--surface);
    color: var(--ink);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .choices button:active { background: var(--silver-light); }
  .choices button .sub {
    display: block;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .feedback {
    border-radius: 12px;

  .feedback.good { border-left-color: var(--good); background: #e7f4ec; }
  .feedback.gold { border-left-color: var(--gold); background: #faf1dd; }
  .feedback.silver { border-left-color: var(--silver); background: #eceef0; }
  .feedback.bad { border-left-color: var(--bad); background: #fbeae8; }
  .feedback .tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 5px;
    color: var(--purple);
  }
  .feedback.good .tag { color: var(--good); }
  .feedback.gold .tag { color: var(--gold); }
  .feedback.silver .tag { color: #6b7076; }
  .feedback.bad .tag { color: var(--bad); }
  .next-btn {
    padding: 13px 14px;
    border-radius: 12px;
    border: none;
    background: var(--purple);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .next-btn:active { background: var(--purple-dark); }
  .instructions {
    background: var(--surface);
    border: 1px solid #e2e0e6;
    border-radius: 14px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
  }
  .instructions h2 { font-size: 16px; margin: 0 0 8px; }
  .instructions ul { margin: 6px 0 0; padding-left: 20px; }
  .instructions li { margin: 5px 0; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 2px; }
  .chip {
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .chip.gold { background: #faf1dd; color: var(--gold); }
  .chip.silver { background: #eceef0; color: #6b7076; }
  .chip.bad { background: #fbeae8; color: var(--bad); }
  .big-btn {
    padding: 15px 14px;
    border-radius: 12px;
    border: none;
    background: var(--purple);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid #e2e0e6;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--purple); }
  .stat-card .label { font-size: 11.5px; color: var(--ink-dim); font-weight: 700; margin-top: 2px; }
  .restart-row { display: flex; gap: 10px; margin-top: 6px; }
  .restart-row button { flex: 1; }
  .ghost-btn {
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--purple);
    background: #fff;
    color: var(--purple);
    font-weight: 800;
    font-size: 14.5px;
    cursor: pointer;
  }
  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-dim);
    padding: 10px 16px 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="team">Fayetteville Girls Silver &middot; Age 11</p>
    <h1 id="headerTitle">Advantage Hunter</h1>
  </header>

  <div class="modebar" id="modebar">
    <button id="btnPractice" class="active">Practice Mode</button>
    <button id="btnTimed">Timed Challenge</button>
  </div>

  <main id="main"></main>

  <footer>Offline practice game &middot; no login, no internet needed &middot; built for team teaching language, not official rules.</footer>
</div>

<script>
/* ---------------------------------------------------------------------
   COURT DRAWING
   viewBox 0,0,300,400. Rim near top. Lane (the "paint") is the key box.
   Gold = inside lane. Silver = just outside lane but not heavily guarded.
   Bad = far outside / heavily contested / teammate more open.
   Labels: our team is purple, numbered 1 through 4 (1 is whoever has
   the ball to start the possession). Defenders are dark and marked X.
--------------------------------------------------------------------- */
const LANE = { x: 95, y: 10, w: 110, h: 165 };

// Every player on the court is the same size: a small head + body token,
// colored by role. Only the fill color and label change.
function playerToken(x, y, color, label, open) {
  let s = "";
  if (open) {
    s += `<circle cx="${x}" cy="${y}" r="24" fill="none" stroke="#c9961f" stroke-width="2" stroke-dasharray="3 3"/>`;
  }
  // jersey-shaped body (shoulders wider than hips) + round head, same size for every player
  s += `<polygon points="${x - 13},${y - 7} ${x + 13},${y - 7} ${x + 9},${y + 17} ${x - 9},${y + 17}" fill="${color}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<circle cx="${x}" cy="${y - 14}" r="7" fill="${color}" stroke="#fff" stroke-width="2"/>`;
  s += `<text x="${x}" y="${y + 9}" font-size="13" fill="#fff" text-anchor="middle" font-weight="800" font-family="inherit">${label}</text>`;
  return s;
}

function courtSVG(players, opts) {
  opts = opts || {};
  const laneFill = opts.highlightLane ? "#f3e9d9" : "#f4f2f7";
  let s = `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="2" y="2" width="296" height="396" rx="10" fill="#fbfafd" stroke="#d8d6de" stroke-width="2"/>`;
  s += `<rect x="20" y="8" width="260" height="388" fill="#ffffff" stroke="#d8d6de" stroke-width="1.5"/>`;
  // lane / key
  s += `<rect x="${LANE.x}" y="${LANE.y}" width="${LANE.w}" height="${LANE.h}" fill="${laneFill}" stroke="#c9c6d1" stroke-width="1.5"/>`;
  // free throw circle
  s += `<circle cx="150" cy="${LANE.y + LANE.h}" r="45" fill="none" stroke="#c9c6d1" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  // backboard + rim
  s += `<line x1="118" y1="16" x2="182" y2="16" stroke="#3f1d61" stroke-width="4"/>`;
  s += `<circle cx="150" cy="30" r="9" fill="none" stroke="#c9961f" stroke-width="3"/>`;
  // baseline label
  s += `<text x="150" y="392" font-size="10" fill="#9aa0a6" text-anchor="middle" font-family="inherit">half court</text>`;

  players.forEach(p => {
    const color = p.role === "defender" ? "#1f2430" : "#5b2a86";
    s += playerToken(p.x, p.y, color, p.label, p.open);
  });
  s += `</svg>`;
  return s;
}

function shotTierFor(x, y) {
  const inLane = x >= LANE.x && x <= LANE.x + LANE.w && y >= LANE.y && y <= LANE.y + LANE.h;
  if (inLane) return "gold";
  const nearLane = x >= LANE.x - 45 && x <= LANE.x + LANE.w + 45 && y <= LANE.y + LANE.h + 70;
  return nearLane ? "silver" : "bad";
}

/* ---------------------------------------------------------------------
   SCENARIOS
   Ordered easiest to hardest. Each scenario is a small hand-built
   decision tree so every read maps exactly to how this team is coached.
   Our team is always numbered 1 (ball handler), 2, 3, 4 — purple.
   Defenders are X — dark.
--------------------------------------------------------------------- */
const SCENARIOS = [

{
  id: "s1",
  title: "2-on-1 Fast Break",
  setup: "You're 1 with the ball. It's you and 2 against one defender.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 150, y: 250, role: "ball", label: "1" },
        { x: 90, y: 260, role: "teammate", label: "2" },
        { x: 150, y: 150, role: "defender", label: "X" },
      ]),
      prompt: "You take the ball to the rim. What now?",
      choices: [
        { label: "Keep going to the rim", sub: "Nobody has stopped you yet", goto: "stopped" },
        { label: "Pass to 2 right now", sub: "Before anyone has committed to you", result: {
          tag: "Read", cls: "silver",
          text: "A little early. Nobody stopped you yet, so the defender could still slide over and take the pass away. Our rule: keep going to the rim until someone actually stops you, then make the pass.",
          score: "earlyPass"
        }},
      ],
    },
    stopped: {
      court: () => courtSVG([
        { x: 140, y: 120, role: "ball", label: "1" },
        { x: 70, y: 180, role: "teammate", label: "2", open: true },
        { x: 130, y: 90, role: "defender", label: "X" },
      ]),
      prompt: "The defender steps up and stops your dribble. Now what?",
      choices: [
        { label: "Pass to 2", sub: "She's wide open for the finish", result: {
          tag: "Gold medal shot", cls: "gold",
          text: "That's it. You went to the rim until someone stopped you, then found the open player. Her shot is right in the lane — gold medal shot, she should take it.",
          score: "goodRead", shot: "gold"
        }},
        { label: "Keep dribbling and force it up yourself", sub: "Through the defender", result: {
          tag: "Bad shot", cls: "bad",
          text: "She stopped you and 2 is wide open. Forcing it here is a bad shot — someone else was more open than you.",
          score: "forcedBad", shot: "bad"
        }},
      ],
    },
  },
},

{
  id: "s8",
  title: "Catch It in Triple Threat",
  setup: "You're 1. You catch an outlet pass on the break.",
  start: "catch",
  steps: {
    catch: {
      court: () => courtSVG([
        { x: 150, y: 280, role: "ball", label: "1" },
        { x: 80, y: 290, role: "teammate", label: "2" },
        { x: 150, y: 160, role: "defender", label: "X" },
      ]),
      prompt: "The pass is on its way to you. How do you catch it?",
      choices: [
        { label: "Meet the pass, land in triple threat", goto: "attack" },
        { label: "Stand still and wait for it to arrive", goto: "late" },
      ],
    },
    late: {
      court: () => courtSVG([
        { x: 150, y: 280, role: "ball", label: "1" },
        { x: 150, y: 190, role: "defender", label: "X" },
      ]),
      prompt: null,
      result: {
        tag: "Read", cls: "silver",
        text: "We meet our passes. Waiting on it lets the defender close the gap and take away your options. Go meet it, land in triple threat, ready to shoot, pass, or drive.",
        score: "earlyPass"
      },
    },
    attack: {
      court: () => courtSVG([
        { x: 150, y: 150, role: "ball", label: "1" },
        { x: 80, y: 230, role: "teammate", label: "2", open: true },
        { x: 145, y: 100, role: "defender", label: "X" },
      ]),
      prompt: "Good catch, triple threat. You attack and the defender finally stops you. 2 is open. What now?",
      choices: [
        { label: "Pass to 2", result: {
          tag: "Gold medal shot", cls: "gold",
          text: "Meet the pass, triple threat, attack until stopped, then find the open player. She's in the lane, gold medal shot.",
          score: "goodRead", shot: "gold"
        }},
        { label: "Force your own shot", result: {
          tag: "Bad shot", cls: "bad",
          text: "She stopped you and 2 is open, someone else was more open than you.",
          score: "forcedBad", shot: "bad"
        }},
      ],
    },
  },
},

{
  id: "s2",
  title: "2-on-1, Early Help",
  setup: "Same 2-on-1, but this time the defender sprints straight at you from the start.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 150, y: 230, role: "ball", label: "1" },
        { x: 90, y: 250, role: "teammate", label: "2" },
        { x: 145, y: 170, role: "defender", label: "X" },
      ]),
      prompt: "The defender is already right in front of you, cutting off your drive. What do you do?",
      choices: [
        { label: "Pass to 2 now", sub: "She already stopped you", goto: "resolve_good" },
        { label: "Keep trying to dribble through her", goto: "resolve_bad" },
      ],
    },
    resolve_good: {
      court: () => courtSVG([
        { x: 150, y: 170, role: "ball", label: "1" },
        { x: 75, y: 190, role: "teammate", label: "2", open: true },
        { x: 145, y: 170, role: "defender", label: "X" },
      ]),
      prompt: null,
      result: {
        tag: "Good read", cls: "good",
        text: "This is the same rule as always, it just happened fast: keep going until someone stops you, then pass. She stopped you almost right away, so the pass almost right away was correct — \"keep going until stopped\" doesn't mean \"always dribble a lot,\" it means read when you're actually stopped.",
        score: "goodRead", shot: "silver"
      },
    },
    resolve_bad: {
      court: () => courtSVG([
        { x: 150, y: 170, role: "ball", label: "1" },
        { x: 75, y: 190, role: "teammate", label: "2", open: true },
        { x: 145, y: 170, role: "defender", label: "X" },
      ]),
      prompt: null,
      result: {
        tag: "Bad shot", cls: "bad",
        text: "She already stopped you and 2 is open. Someone else was more open than you — that's a bad shot.",
        score: "forcedBad", shot: "bad"
      },
    },
  },
},

{
  id: "s3",
  title: "3-on-2 Down the Middle",
  setup: "You're 1. Three of you push the ball against two defenders.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 150, y: 260, role: "ball", label: "1" },
        { x: 70, y: 270, role: "teammate", label: "2" },
        { x: 230, y: 270, role: "teammate", label: "3" },
        { x: 130, y: 170, role: "defender", label: "X" },
        { x: 190, y: 120, role: "defender", label: "X" },
      ]),
      prompt: "You attack the middle. What's your read?",
      choices: [
        { label: "Keep attacking the rim", sub: "No one has stopped you", goto: "stopped" },
        { label: "Throw it ahead to a wing right away", goto: "early" },
      ],
    },
    early: {
      court: () => courtSVG([
        { x: 150, y: 260, role: "ball", label: "1" },
        { x: 70, y: 270, role: "teammate", label: "2" },
        { x: 230, y: 270, role: "teammate", label: "3" },
      ]),
      prompt: null,
      result: {
        tag: "Read", cls: "silver",
        text: "That can work sometimes, but you gave up your advantage before the defense had to commit. Our rule on the break: keep going to the rim until someone actually stops you, then make the pass to the open player.",
        score: "earlyPass"
      },
    },
    stopped: {
      court: () => courtSVG([
        { x: 150, y: 150, role: "ball", label: "1" },
        { x: 70, y: 230, role: "teammate", label: "2", open: true },
        { x: 230, y: 230, role: "teammate", label: "3" },
        { x: 140, y: 110, role: "defender", label: "X" },
        { x: 185, y: 150, role: "defender", label: "X" },
      ]),
      prompt: "A defender steps up on you. 2 is open. What now?",
      choices: [
        { label: "Pass to 2", sub: "Open just outside the lane", result: {
          tag: "Silver shot", cls: "silver",
          text: "Good read, going to the rim until stopped, then passing. 2's shot is just outside the lane and open — that's a silver shot, a good one.",
          score: "goodRead", shot: "silver"
        }},
        { label: "Spin back and shoot it yourself", result: {
          tag: "Bad shot", cls: "bad",
          text: "She already stopped you and 2 is open. Someone else was more open than you.",
          score: "forcedBad", shot: "bad"
        }},
      ],
    },
  },
},

{
  id: "s7",
  title: "Who's More Open?",
  setup: "You're 1. You get a step on your defender just outside the lane.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 110, y: 140, role: "ball", label: "1" },
        { x: 190, y: 90, role: "teammate", label: "2", open: true },
        { x: 95, y: 170, role: "defender", label: "X" },
      ]),
      prompt: "You have a decent look just outside the lane, but 2 is wide open in the lane. What do you do?",
      choices: [
        { label: "Take your own open shot", goto: "own_shot" },
        { label: "Pass to 2 in the lane", goto: "pass_teammate" },
      ],
    },
    own_shot: {
      court: () => courtSVG([
        { x: 110, y: 140, role: "ball", label: "1" },
        { x: 190, y: 90, role: "teammate", label: "2" },
      ]),
      prompt: null,
      result: {
        tag: "Bad shot", cls: "bad",
        text: "Your shot is OK, but remember: bad shots aren't just contested ones, they're also shots you take when someone else is more open than you. She's wide open in the lane, that's the pass.",
        score: "forcedBad", shot: "silver"
      },
    },
    pass_teammate: {
      court: () => courtSVG([
        { x: 190, y: 90, role: "ball", label: "2" },
        { x: 110, y: 140, role: "teammate", label: "1" },
      ]),
      prompt: null,
      result: {
        tag: "Gold medal shot", cls: "gold",
        text: "Exactly right. Your look was fine, but she was more open and in the lane, that's a gold medal shot and the right pass.",
        score: "goodRead", shot: "gold"
      },
    },
  },
},

{
  id: "s6",
  title: "Paint Touch Drive",
  setup: "You're 1. A defender stays attached to you the whole way. No clean pass is open yet.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 150, y: 260, role: "ball", label: "1" },
        { x: 150, y: 200, role: "defender", label: "X" },
      ]),
      prompt: "Your defender is attached to your hip the whole way. What's your purpose with the dribble?",
      choices: [
        { label: "Dribble with a purpose into the paint, finish through contact", sub: "Get the paint touch", goto: "finish" },
        { label: "Dribble around outside, just killing the clock", goto: "settle" },
      ],
    },
    finish: {
      court: () => courtSVG([
        { x: 150, y: 90, role: "ball", label: "1" },
        { x: 150, y: 110, role: "defender", label: "X" },
      ]),
      prompt: null,
      result: {
        tag: "Gold medal shot", cls: "gold",
        text: "That's a paint touch with a purpose. If she's still on you, go ahead and try to create contact on that first dribble instead of just dribbling to dribble, then finish. You're in the lane, gold medal shot.",
        score: "goodRead", shot: "gold"
      },
    },
    settle: {
      court: () => courtSVG([
        { x: 90, y: 250, role: "ball", label: "1" },
        { x: 95, y: 220, role: "defender", label: "X" },
      ]),
      prompt: null,
      result: {
        tag: "Read", cls: "silver",
        text: "Dribbling just to dribble doesn't get you anywhere. Get a paint touch on purpose, drive with a reason, and if she's still attached, look to finish through the contact.",
        score: "earlyPass"
      },
    },
  },
},

{
  id: "s4",
  title: "3-on-2, Resist the Early Pass",
  setup: "You're 1. Another 3-on-2. The defense hangs back at first.",
  start: "attack",
  steps: {
    attack: {
      court: () => courtSVG([
        { x: 150, y: 270, role: "ball", label: "1" },
        { x: 70, y: 260, role: "teammate", label: "2" },
        { x: 230, y: 260, role: "teammate", label: "3" },

/* ---------------------------------------------------------------------
   GAME STATE + ENGINE
--------------------------------------------------------------------- */
let mode = "practice"; // "practice" | "timed"
let order = [];
let idx = 0;
let currentStep = null;
let timerInterval = null;
let timeLeft = 15;

const tally = {
  goodRead: 0, earlyPass: 0, forcedBad: 0,
  gold: 0, silver: 0, bad: 0,
};

const main = document.getElementById("main");
const headerTitle = document.getElementById("headerTitle");
const btnPractice = document.getElementById("btnPractice");
const btnTimed = document.getElementById("btnTimed");

btnPractice.onclick = () => { mode = "practice"; setActiveMode(); startGame(); };
btnTimed.onclick = () => { mode = "timed"; setActiveMode(); startGame(); };

function setActiveMode() {
  btnPractice.classList.toggle("active", mode === "practice");
  btnTimed.classList.toggle("active", mode === "timed");
}

function scenarioOrder() {
  // Fixed easy-to-hard order (not shuffled) so the first scenarios a
  // player sees are always the simplest ones.
  return SCENARIOS.map((_, i) => i);
}

function resetTally() {
  tally.goodRead = 0; tally.earlyPass = 0; tally.forcedBad = 0;
  tally.gold = 0; tally.silver = 0; tally.bad = 0;
}

function startGame() {
  resetTally();
  order = scenarioOrder();
  idx = 0;
  renderIntro();
}

function renderIntro() {
  window.scrollTo(0, 0);
  headerTitle.textContent = "Advantage Hunter";
  main.innerHTML = `
    <div class="instructions">
      <h2>How to play</h2>
      <p>Ten fast-break situations: 2-on-1, 3-on-2, and 4-on-3. Read the defense, make the right decision, and find the best shot.</p>
      <ul>
        <li>Purple with a number is our team. 1 always starts with the ball. X is a defender.</li>
        <li>Keep going to the rim until someone actually stops you, then make the pass to the open player.</li>
        <li>Fake a pass to make a pass when a defender sits in the lane.</li>
        <li>Move the ball. Swing it, don't stay on one side of the court.</li>
      </ul>
      <div class="chip-row">
        <span class="chip gold">Gold shot: in the lane</span>
        <span class="chip silver">Silver shot: open, just outside</span>
        <span class="chip bad">Bad shot: contested, or someone else was more open</span>
      </div>
      ${mode === "timed" ? "<p><b>Timed Challenge:</b> you get 15 seconds per decision. Read fast!</p>" : "<p><b>Practice Mode:</b> take your time, read every explanation.</p>"}
    </div>
    <button class="big-btn" id="startBtn">Start — Scenario 1 of ${SCENARIOS.length}</button>
  `;
  document.getElementById("startBtn").onclick = () => showScenario();
}

function showScenario() {
  clearTimer();
  if (idx >= order.length) { renderSummary(); return; }
  const sc = SCENARIOS[order[idx]];
  currentStep = { scenario: sc, stepKey: sc.start };
  renderStep();
}

function renderStep() {
  window.scrollTo(0, 0);
  const sc = currentStep.scenario;
  const step = sc.steps[currentStep.stepKey];
  headerTitle.textContent = `Scenario ${idx + 1} / ${SCENARIOS.length}`;

  let html = `
    <div class="progress">
      <span>${sc.title}</span>
      ${mode === "timed" ? `<span class="timer" id="timerDisplay">0:15</span>` : ""}
    </div>
  `;

  if (!step.prompt && step.result) {
    html += renderResultBlock(step.result);
    main.innerHTML = html;
    attachResultCourt(step);
    document.getElementById("continueBtn").onclick = () => {
      applyScore(step.result);
      idx++; showScenario();
    };
    return;
  }

  html += `<p class="scenario-text">${sc.setup}</p>`;
  html += `<div class="court-card" id="courtHolder"></div>`;
  html += `<p class="prompt">${step.prompt}</p>`;
  html += `<div class="choices" id="choiceHolder"></div>`;

  main.innerHTML = html;
  document.getElementById("courtHolder").innerHTML = step.court();

  const holder = document.getElementById("choiceHolder");
  step.choices.forEach((c) => {
    const b = document.createElement("button");
    b.innerHTML = c.label + (c.sub ? `<span class="sub">${c.sub}</span>` : "");
    b.onclick = () => handleChoice(c);
    holder.appendChild(b);
  });

  if (mode === "timed") startTimer(step);
}

function handleChoice(choice) {
  clearTimer();
  if (choice.goto) {
    currentStep.stepKey = choice.goto;
    renderStep();
  } else if (choice.result) {
    renderResult(choice.result);
  }
}

function renderResult(result) {
  window.scrollTo(0, 0);
  let html = `
    <div class="progress"><span>${currentStep.scenario.title}</span></div>
    <div class="court-card" id="courtHolder"></div>
  `;
  html += renderResultBlock(result);
  main.innerHTML = html;
  const step = currentStep.scenario.steps[currentStep.stepKey];
  document.getElementById("courtHolder").innerHTML = step.court();
  document.getElementById("continueBtn").onclick = () => {
    applyScore(result);
    idx++; showScenario();
  };
}

function renderResultBlock(result) {
  return `
    <div class="feedback ${result.cls}">
      <span class="tag">${result.tag}</span>
      <div>${result.text}</div>
    </div>
    <button class="next-btn" id="continueBtn">Next &rarr;</button>
  `;
}

function attachResultCourt(step) {
  // used when a step has no prompt, i.e. auto-resolves straight to a result
  const holder = document.createElement("div");
  holder.className = "court-card";
  holder.innerHTML = step.court();
  main.insertBefore(holder, main.children[1]);
}

function applyScore(result) {
  if (result.score) tally[result.score] = (tally[result.score] || 0) + 1;
  if (result.shot) tally[result.shot] = (tally[result.shot] || 0) + 1;
}

function startTimer(step) {
  timeLeft = 15;
  const disp = document.getElementById("timerDisplay");
  if (disp) disp.textContent = "0:" + String(timeLeft).padStart(2, "0");
  timerInterval = setInterval(() => {
    timeLeft--;
    const d = document.getElementById("timerDisplay");
    if (d) d.textContent = "0:" + String(Math.max(timeLeft, 0)).padStart(2, "0");
    if (timeLeft <= 0) {
      clearTimer();
      // time's up: treat as the first (usually "keep attacking / correct") choice by default,
      // but mark feedback so the coach/player knows it was a timeout, not a real pick.
      const fallback = step.choices[0];
      if (fallback.goto) {
        currentStep.stepKey = fallback.goto;
        renderStep();
      } else if (fallback.result) {
        const timedOutResult = Object.assign({}, fallback.result, {
          tag: "Time's up — " + fallback.result.tag,
        });
        renderResult(timedOutResult);
      }
    }
  }, 1000);
}

function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function renderSummary() {
  window.scrollTo(0, 0);
  headerTitle.textContent = "Results";
  try {
    parent.postMessage({ source: "silver-games", type: "summary", gameId: "advantage_hunter", mode: mode, tally: Object.assign({}, tally) }, "*");
  } catch (e) {}
  const totalReads = tally.goodRead + tally.earlyPass + tally.forcedBad;
  const totalShots = tally.gold + tally.silver + tally.bad;
  main.innerHTML = `
    <p class="scenario-text">Reads and shot selection are scored separately, a good read with a missed shot is still a good read.</p>
    <h2 style="margin:4px 0 0;">Reads</h2>
    <div class="summary-grid">
      <div class="stat-card"><div class="num">${tally.goodRead}</div><div class="label">Good reads</div></div>
      <div class="stat-card"><div class="num">${tally.earlyPass}</div><div class="label">Passed too early</div></div>
      <div class="stat-card"><div class="num">${tally.forcedBad}</div><div class="label">Forced it anyway</div></div>
      <div class="stat-card"><div class="num">${totalReads}</div><div class="label">Total decisions</div></div>
    </div>
    <h2 style="margin:14px 0 0;">Shot selection</h2>
    <div class="summary-grid">
      <div class="stat-card"><div class="num" style="color:#c9961f;">${tally.gold}</div><div class="label">Gold shots</div></div>
      <div class="stat-card"><div class="num" style="color:#6b7076;">${tally.silver}</div><div class="label">Silver shots</div></div>
      <div class="stat-card"><div class="num" style="color:#b5392f;">${tally.bad}</div><div class="label">Bad shots</div></div>
      <div class="stat-card"><div class="num">${totalShots}</div><div class="label">Total shots</div></div>
    </div>
    <p class="scenario-text" style="margin-top:10px;">Screenshot this screen for your coach, this game saves no scores on its own.</p>
    <div class="restart-row">
      <button class="ghost-btn" id="replayBtn">Play Again</button>
      <button class="next-btn" id="menuBtn">Change Mode</button>
    </div>
  `;
  document.getElementById("replayBtn").onclick = () => startGame();
  document.getElementById("menuBtn").onclick = () => renderIntro();
}

// boot
try { parent.postMessage({ source: "silver-games", type: "ready", gameId: "advantage_hunter" }, "*"); } catch (e) {}
setActiveMode();
startGame();
</script>
</body>
